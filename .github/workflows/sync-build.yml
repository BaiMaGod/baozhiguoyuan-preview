name: Sync preview build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-build.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Web artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-42c0-8208-a681-c48fcd79945a/raw?se=2026-10-07T14%3A08%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=dbc3c682-b1d9-5ec5-b675-47862262fb58&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T13%3A43%3A26Z&ske=2026-10-08T13%3A43%3A26Z&sks=b&skv=2026-02-06&sig=hcwGWxatqDstTdsdjx83hyCa26uA3/lueSfGTSTH71c%3D"
        run: |
          set -euo pipefail
          rm -rf /tmp/baozhi-site /tmp/baozhi-site.zip
          mkdir -p /tmp/baozhi-site
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/baozhi-site.zip
          unzip -q /tmp/baozhi-site.zip -d /tmp/baozhi-site
          test -s /tmp/baozhi-site/index.html
          grep -q '"commitSha": "56da74b00c7c37bab58a6ea5cc4db04a5617e2be"' /tmp/baozhi-site/build-manifest.json

      - name: Replace preview contents
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/baozhi-site/. .
          touch .nojekyll
          cat > PREVIEW_BUILD.txt <<'EOF'
          source_repository=BaiMaGod/baozhiguoyuan
          source_commit=56da74b00c7c37bab58a6ea5cc4db04a5617e2be
          source_workflow_run=37631191353
          engine=LayaAir 3.4.0
          target=web
          EOF

      - name: Commit preview build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already matches artifact."
            exit 0
          fi
          git commit -m "deploy: preview 56da74b"
          git push origin HEAD:main
