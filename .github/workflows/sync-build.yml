name: Sync verified preview build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-build.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Web artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7690-8211-b7bf-142314e38282/raw?se=2026-10-07T14%3A38%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=d62c5bdc-7099-50ad-a848-c0c43cf0566b&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T02%3A36%3A24Z&ske=2026-10-08T02%3A36%3A24Z&sks=b&skv=2026-02-06&sig=%2B5xbFFVoMrzzbDQoIvgYzoEXC2iM7BPNmtN7QmNNn0M%3D"
        run: |
          set -euo pipefail
          rm -rf /tmp/baozhi-site /tmp/baozhi-site.zip
          mkdir -p /tmp/baozhi-site
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/baozhi-site.zip
          unzip -q /tmp/baozhi-site.zip -d /tmp/baozhi-site
          test -s /tmp/baozhi-site/index.html
          grep -q '"commitSha": "648fa2841a3275d580d405ccd81c3f516812abbc"' /tmp/baozhi-site/build-manifest.json

      - name: Replace preview contents
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/baozhi-site/. .
          touch .nojekyll
          cat > PREVIEW_BUILD.txt <<'EOF'
          source_repository=BaiMaGod/baozhiguoyuan
          source_commit=648fa2841a3275d580d405ccd81c3f516812abbc
          source_workflow_run=37637362919
          engine=LayaAir 3.4.0
          target=web
          verified_live_loop=true
          verified_real_mouse_joystick=true
          EOF

      - name: Commit preview build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already matches artifact."
            exit 0
          fi
          git commit -m "deploy: preview 648fa28"
          git push origin HEAD:main
